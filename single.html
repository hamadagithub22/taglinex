<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Image</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <style>
    body {
      background-color: #111;
      color: #fff;
      text-align: center;
    }
    .main-img {
      width: 80%;
      max-width: 800px;
      border-radius: 10px;
      box-shadow: 0 0 10px #000;
      margin: 30px auto;
      display: block;
    }
    .thumbs {
      display: flex;
      justify-content: center;
      gap: 15px;
      flex-wrap: wrap;
    }
    .thumbs img {
      width: 120px;
      height: 80px;
      object-fit: cover;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.3s, border 0.3s;
    }
    .thumbs img:hover {
      transform: scale(1.1);
      border: 2px solid #0d6efd;
    }
  </style>
</head>
<body>

  <div class="container mt-4">
    <a href="index.html#section3" class="btn btn-primary mb-4">⬅ الرجوع للمشاريع</a>
    <img id="mainImage" class="main-img" src="" alt="Main Project Image">

    <div class="thumbs mt-4">
      <img src="./assets/images/1.PNG" alt="">
      <img src="./assets/images/project4.PNG" alt="">
      <img src="./assets/images/project8.PNG" alt="">
      <img src="./assets/images/project9.PNG" alt="">
    </div>
  </div>

  <script>
    // 1️⃣ جلب الصورة من الرابط
    const urlParams = new URLSearchParams(window.location.search);
    const imgSrc = urlParams.get('img');
    const mainImage = document.getElementById('mainImage');
    if (imgSrc) mainImage.src = imgSrc;

    // 2️⃣ عند الضغط على صورة صغيرة تتغير الكبيرة
    const thumbs = document.querySelectorAll('.thumbs img');
    thumbs.forEach(thumb => {
      thumb.addEventListener('click', () => {
        mainImage.src = thumb.src;
      });
    });
  </script>

</body>
</html>
